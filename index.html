    <div class="foot"><span class="note">${Math.round(m*100)}% mastered</span><button class="primary" data-start="${d}" ${s.total?"":"disabled"}>Start</button></div></div>`}).join("")}
    <div class="card"><div class="row" style="justify-content:space-between"><span class="dcode">ALL</span><span class="pill none">mixed</span></div><h3>Mixed review</h3><p>Questions from every domain, using the options above.</p><div class="foot"><span class="note">${QUESTIONS.length} questions</span><button class="primary" data-start="all" ${QUESTIONS.length?"":"disabled"}>Start</button></div></div>
  </div></div>`;
  const m=document.getElementById("p-mode"),s=document.getElementById("p-size");m.value=pOpts.mode;s.value=pOpts.size;
  m.onchange=()=>pOpts.mode=m.value;s.onchange=()=>pOpts.size=s.value;
}
function missedIn(d){const last=latestByQuestion();return QUESTIONS.filter(q=>(d==="all"||q.d==d)&&last[q.id]===0)}
function startPractice(d){
  const last=latestByQuestion(),r=rng(Date.now());
  let pool=QUESTIONS.filter(q=>d==="all"||q.d==d);
  if(pOpts.mode==="missed"){pool=pool.filter(q=>last[q.id]===0);if(!pool.length){flash("No missed questions in this domain yet. Try 'Unseen first'.");return}pool=shuffle(pool,r)}
  else if(pOpts.mode==="unseen"){const un=shuffle(pool.filter(q=>!(q.id in last)),r),se=shuffle(pool.filter(q=>q.id in last),r);pool=[...un,...se]}
  else pool=shuffle(pool,r);
  if(!pool.length){flash("No questions in this domain yet.");return}
  const n=pOpts.size==="all"?pool.length:Math.min(+pOpts.size,pool.length);
  run={kind:"practice",domain:d,title:d==="all"?"Practice · Mixed":"Practice · D"+d+" "+DOMAINS[d].name,ids:pool.slice(0,n).map(q=>q.id),i:0,sel:{},checked:{},start:Date.now()};
  render();window.scrollTo(0,0);
}
function renderPractice(){
  const q=QBY[run.ids[run.i]],sel=run.sel[q.id]||[],done=run.checked[q.id],multi=q.a.length>1;
  const correctN=Object.keys(run.checked).filter(id=>isRight(QBY[id],run.sel[id])).length;
  app.innerHTML=`<div class="runner">
  <div class="rhead"><div class="grow"><div class="eyebrow">${esc(run.title)}</div></div><span class="num note">${correctN} right · ${Object.keys(run.checked).length} checked</span><button class="ghost" data-act="quit">End round</button></div>
  <div class="progress"><i style="width:${(run.i+(done?1:0))/run.ids.length*100}%"></i></div>
  <div class="panel">
    <div class="eyebrow" style="margin-bottom:8px">Question ${run.i+1} of ${run.ids.length} · D${q.d}</div>
    <p class="qtext">${esc(q.q)}</p>${multi?`<div class="qhint">Select ${q.a.length} answers.</div>`:""}
    <div class="choices">${choicesHTML(q,sel,done)}</div>
    ${done?`<div class="explain"><b>${isRight(q,sel)?"Correct.":"Not quite. Correct: "+correctLetters(q)}</b>${esc(q.e)}${srcLine(q)}</div>`:""}
    <div class="row" style="justify-content:flex-end">${done?`<button class="primary" data-act="pnext">${run.i===run.ids.length-1?"See results":"Next question"}</button>`:`<button class="primary" data-act="check" ${sel.length===q.a.length?"":"disabled"}>Check answer</button>`}</div>
  </div></div>`;
}
function choicesHTML(q,sel,reveal){
  return ORDER[q.id].map((oi,pos)=>{
    let cls="";if(reveal){if(q.a.includes(oi))cls="correct";else if(sel.includes(oi))cls="wrong"}
    return `<button class="choice ${cls}" data-opt="${oi}" aria-pressed="${sel.includes(oi)}" ${reveal?"disabled":""}><span class="k">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`}).join("");
}
function correctLetters(q){return ORDER[q.id].map((oi,pos)=>q.a.includes(oi)?L[pos]:null).filter(Boolean).join(", ")}
function isRight(q,sel){sel=sel||[];return sel.length===q.a.length&&q.a.every(x=>sel.includes(x))}
function toggle(q,oi){
  const cur=(run.sel[q.id]||[]).slice();const k=cur.indexOf(oi);
  if(q.a.length===1){run.sel[q.id]=[oi];return}
  if(k>=0)cur.splice(k,1);else{if(cur.length>=q.a.length)cur.shift();cur.push(oi)}
  run.sel[q.id]=cur;
}
async function finishPractice(){
  const ids=run.ids.filter(id=>run.checked[id]);
  if(!ids.length){run=null;render();return}
  const answers=ids.map(id=>[id,isRight(QBY[id],run.sel[id])?1:0]);
  const a={id:"p"+Date.now().toString(36),kind:"practice",title:run.title,domain:run.domain,ts:Date.now(),dur:Math.round((Date.now()-run.start)/1000),total:ids.length,correct:answers.filter(x=>x[1]).length,answers,sel:Object.fromEntries(ids.map(id=>[id,run.sel[id]]))};
  await saveAttempt(a);result=a;run=null;render();window.scrollTo(0,0);
}

// ---- exams
function validRun(){const r=lsGet(LS_RUN);if(r&&!r.ids.every(id=>QBY[id])){lsSet(LS_RUN,null);return null}return r}
function renderExamsHome(){
  const ex=exams(),resume=validRun();
  const card=(key,name,desc,n=60)=>{const mine=ex.filter(a=>a.set===key);const best=mine.reduce((m,a)=>Math.max(m,a.score),0);return `<div class="card">
    <div class="row" style="justify-content:space-between"><span class="dcode">${n} Q · ${examMinutes(n)} MIN</span><span class="pill ${!mine.length?"none":best>=PASS?"pass":"fail"}">${!mine.length?"not taken":"best "+best}</span></div>
    <h3>${name}</h3><p>${desc}</p>
    <div class="foot"><span class="note">${mine.length} attempt${mine.length===1?"":"s"}</span><button class="primary" data-exam="${key}">Start exam</button></div></div>`};
  app.innerHTML=`<div class="stack">
  <div><div class="eyebrow">Full exam simulation</div><h1>Full exam sets</h1><p class="lede">Each set runs like the real exam: no feedback until you submit, and a timer of 2 minutes per question (120 minutes for 60) that submits for you when it reaches zero.</p></div>
  ${resume?`<div class="banner"><span>Unfinished: <b>${esc(resume.title)}</b>, question ${resume.i+1} of ${resume.ids.length}.</span><button class="ghost" data-act="discard">Discard</button><button class="primary" data-act="resume">Resume</button></div>`:""}
  <div class="grid">
    ${SETS.map(s=>card(s.key,s.name,`Your uploaded ${s.name}, in its original order.`,s.ids.length)).join("")}
    ${canRandom()?card("random","Random mix","60 new picks from the full bank each time, still matching the domain weights."):""}
    ${!SETS.length&&!canRandom()?`<div class="empty" style="grid-column:1/-1">No exam sets yet. A full exam needs at least ${Object.values(DOMAINS).map(D=>D.n).join(", ")} questions in domains 1 to 7. The bank has ${QUESTIONS.length} right now.</div>`:""}
  </div>
  <div class="panel"><h3 style="margin-bottom:8px">Questions per domain in a full 60-question exam</h3><div class="tablewrap"><table class="hist"><thead><tr><th>Domain</th><th>Weight</th><th>Questions</th></tr></thead><tbody>${Object.entries(DOMAINS).map(([d,D])=>`<tr><td>D${d} ${D.name}</td><td class="num">${D.w}%</td><td class="num">${D.n}</td></tr>`).join("")}</tbody></table></div>
  <p class="note" style="margin-top:10px">Question bank: ${QUESTIONS.length} questions.</p>
  ${QUESTIONS.some(q=>q.s==="amey")?`<details class="note" style="margin-top:8px"><summary>Credits and licence</summary><p>Questions marked "Amey Thakur" come from <a href="https://github.com/Amey-Thakur/CLAUDE-CERTIFICATIONS" target="_blank" rel="noopener" style="color:inherit">github.com/Amey-Thakur/CLAUDE-CERTIFICATIONS</a>, used under the MIT License: Copyright (c) 2026 Amey Thakur. Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions: The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.</p></details>`:""}
  <p class="note" style="margin-top:10px">Scores here are your share of correct answers on a 1000 scale. The real exam uses a scaled score, so treat 720 as a target, not an exact prediction.</p></div>
  </div>`;
}
function startExam(key){
  const s=SETS.find(x=>x.key===key);
  run={kind:"exam",set:key,title:s?s.name:"Random mix",ids:s?s.ids.slice():randomExam(),i:0,sel:{},flags:{},start:Date.now(),deadline:Date.now()+examMinutes((s?s.ids:[]).length||60)*60000,confirm:false};
  lsSet(LS_RUN,run);render();window.scrollTo(0,0);tick();
}
let timerId=null;
function tick(){clearInterval(timerId);timerId=setInterval(()=>{if(!run||run.kind!=="exam"){clearInterval(timerId);return}
  const left=run.deadline-Date.now();const el=document.getElementById("timer");
  if(left<=0){clearInterval(timerId);finishExam(true);return}
  if(el){el.textContent=fmtClock(left);el.classList.toggle("low",left<10*60000)}},1000)}
const fmtClock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600))+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function renderExam(){
  const q=QBY[run.ids[run.i]],sel=run.sel[q.id]||[],multi=q.a.length>1,answered=run.ids.filter(id=>(run.sel[id]||[]).length).length;
  const unanswered=run.ids.length-answered,flagged=Object.values(run.flags).filter(Boolean).length,left=run.deadline-Date.now();
  app.innerHTML=`<div class="runner">
  <div class="rhead"><div class="grow"><div class="eyebrow">${esc(run.title)}</div></div><span class="timer ${left<600000?"low":""}" id="timer" aria-label="Time left">${fmtClock(left)}</span><button class="ghost" data-act="pause">Save and leave</button></div>
  <div class="progress"><i style="width:${answered/run.ids.length*100}%"></i></div>
  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="eyebrow">Question ${run.i+1} of ${run.ids.length}</div><button class="ghost" data-act="flag" aria-pressed="${!!run.flags[q.id]}" style="color:${run.flags[q.id]?"var(--warn)":"var(--muted)"}">${run.flags[q.id]?"Flagged for review":"Flag for review"}</button></div>
    <p class="qtext">${esc(q.q)}</p>${multi?`<div class="qhint">Select ${q.a.length} answers.</div>`:""}
    <div class="choices">${choicesHTML(q,sel,false)}</div>
    <div class="row" style="justify-content:space-between"><button data-act="prev" ${run.i?"":"disabled"}>Previous</button>
      <div class="row">${run.i<run.ids.length-1?`<button class="primary" data-act="next">Next</button>`:""}<button ${run.i===run.ids.length-1?'class="primary"':""} data-act="submit">Submit exam</button></div></div>
    ${run.confirm?`<div class="confirm"><b>Submit now?</b> ${unanswered?`${unanswered} question${unanswered===1?" is":"s are"} unanswered and will count as wrong. `:"All questions answered. "}${flagged?`${flagged} flagged for review.`:""}<div class="row" style="margin-top:10px"><button data-act="cancel-submit">Keep working</button><button class="primary" data-act="do-submit">Submit and see score</button></div></div>`:""}
  </div>
  <div class="navgrid" aria-label="Question navigator">${run.ids.map((id,i)=>`<button data-jump="${i}" class="${(run.sel[id]||[]).length?"ans":""} ${i===run.i?"cur":""} ${run.flags[id]?"flag":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
  <p class="note" style="margin-top:10px">${answered}/${run.ids.length} answered · ${flagged} flagged. Shaded = answered, orange underline = flagged.</p>
  </div>`;
}
async function finishExam(auto){
  clearInterval(timerId);
  const answers=run.ids.map(id=>[id,isRight(QBY[id],run.sel[id])?1:0]);const correct=answers.filter(x=>x[1]).length;
  const per={};answers.forEach(([id,ok])=>{const d=QBY[id].d;per[d]=per[d]||[0,0];per[d][1]++;if(ok)per[d][0]++});
  const a={id:"e"+Date.now().toString(36),kind:"exam",set:run.set,title:run.title,ts:Date.now(),dur:Math.round((Math.min(Date.now(),run.deadline)-run.start)/1000),total:run.ids.length,correct,score:Math.round(correct/run.ids.length*1000),per,answers,sel:run.sel,order:run.ids,auto:!!auto};
  lsSet(LS_RUN,null);await saveAttempt(a);result=a;run=null;render();window.scrollTo(0,0);
}

// ---- results
let reviewFilter="wrong";
function renderResult(){
  const a=result,isExam=a.kind==="exam",ids=a.order||a.answers.map(x=>x[0]),okMap=Object.fromEntries(a.answers);
  const per={};a.answers.forEach(([id,ok])=>{const d=QBY[id]?.d;if(!d)return;per[d]=per[d]||[0,0];per[d][1]++;if(ok)per[d][0]++});
  const list=ids.filter(id=>QBY[id]&&(reviewFilter==="all"||!okMap[id]));
  app.innerHTML=`<div class="stack">
  <div><div class="eyebrow">${esc(a.title)} · ${fmtDur(a.dur)}${a.auto?" · time ran out":""}</div><h1>${isExam?(a.score>=PASS?"You passed this set":"Not there yet"):"Round complete"}</h1></div>
  <div class="panel score-hero">
    <div class="score-big">${isExam?`${a.score}<small>/1000</small>`:`${a.correct}<small>/${a.total}</small>`}</div>
    <div><span class="pill ${isExam?(a.score>=PASS?"pass":"fail"):(a.correct/a.total>=.72?"pass":"warn")}">${isExam?(a.score>=PASS?"Pass · 720+":"Below 720"):pct(a.correct/a.total)}</span>
    <p class="note" style="margin:6px 0 0">${a.correct} of ${a.total} correct. ${isExam?(a.score>=PASS?"Keep the margin by reviewing the questions you missed.":`You need about ${Math.max(0,Math.ceil(PASS/1000*a.total)-a.correct)} more correct answers to reach 720.`):"Missed questions are saved, so you can retry them later."}</p></div>
  </div>
  <section class="panel"><h2 style="margin-bottom:6px">By domain</h2><div class="domains">${Object.entries(per).sort((x,y)=>x[0]-y[0]).map(([d,[c,t]])=>`<div class="drow"><div class="dcode">D${d}</div><div><div class="dname">${DOMAINS[d].name}</div><div class="dmeta">${c} of ${t} correct</div></div><div class="bar target"><i style="width:${c/t*100}%;background:${c/t>=.72?"var(--good)":"var(--bad)"}"></i></div><div class="dpct">${pct(c/t)}</div></div>`).join("")}</div></section>
  <section class="stack" style="gap:12px"><div class="row" style="justify-content:space-between"><h2>Review answers</h2>
    <div class="row"><select id="rf" aria-label="Which questions to show"><option value="wrong">Only ones I missed</option><option value="all">All questions</option></select></div></div>
    <div class="review">${list.length?list.map(id=>reviewItem(QBY[id],(a.sel||{})[id]||[],ids.indexOf(id)+1)).join(""):`<div class="empty">Every answer was correct. Nothing to review.</div>`}</div></section>
  <div class="row"><button class="primary" data-go="${isExam?"exams":"practice"}">${isExam?"Back to exams":"Practise again"}</button><button data-go="dashboard">Open dashboard</button></div>
  </div>`;
  const rf=document.getElementById("rf");rf.value=reviewFilter;rf.onchange=()=>{reviewFilter=rf.value;renderResult()};
}
function reviewItem(q,sel,n){
  const ok=isRight(q,sel);
  return `<div class="ritem"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="eyebrow">Q${n} · D${q.d}</span><span class="pill ${ok?"pass":sel.length?"fail":"none"}">${ok?"correct":sel.length?"wrong":"skipped"}</span></div>
  <p class="qtext">${esc(q.q)}</p><ul>${ORDER[q.id].map((oi,pos)=>`<li class="${q.a.includes(oi)?"c":sel.includes(oi)?"x":""}">${L[pos]}. ${esc(q.o[oi])}${sel.includes(oi)?" (your answer)":""}</li>`).join("")}</ul>
  <div class="explain" style="margin:0">${esc(q.e)}${srcLine(q)}</div></div>`;
}

// ---- events
let flashT;function flash(msg){let el=document.getElementById("flash");if(!el){el=document.createElement("div");el.id="flash";el.setAttribute("role","status");el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)";document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(flashT);flashT=setTimeout(()=>el.hidden=true,3200)}
app.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go){result=null;run=run&&run.kind==="exam"?run:null;go(b.dataset.go);return}
  if(b.dataset.start){startPractice(b.dataset.start);return}
  if(b.dataset.exam){if(lsGet(LS_RUN)){flash("Finish or discard your unfinished exam first.");return}startExam(b.dataset.exam);return}
  if(b.dataset.opt!=null&&run){const q=QBY[run.ids[run.i]];if(run.kind==="practice"&&run.checked[q.id])return;toggle(q,+b.dataset.opt);if(run.kind==="exam")lsSet(LS_RUN,run);render();return}
  if(b.dataset.jump!=null){run.i=+b.dataset.jump;run.confirm=false;lsSet(LS_RUN,run);render();return}
  const act=b.dataset.act;
  if(act==="check"){run.checked[run.ids[run.i]]=1;render()}
  else if(act==="pnext"){if(run.i<run.ids.length-1){run.i++;render();window.scrollTo(0,0)}else finishPractice()}
  else if(act==="quit")finishPractice();
  else if(act==="next"){run.i++;run.confirm=false;lsSet(LS_RUN,run);render()}
  else if(act==="prev"){run.i--;run.confirm=false;lsSet(LS_RUN,run);render()}
  else if(act==="flag"){const id=run.ids[run.i];run.flags[id]=!run.flags[id];lsSet(LS_RUN,run);render()}
  else if(act==="submit"){run.confirm=true;render()}
  else if(act==="cancel-submit"){run.confirm=false;render()}
  else if(act==="do-submit")finishExam(false);
  else if(act==="pause"){lsSet(LS_RUN,run);clearInterval(timerId);run=null;go("exams");flash("Exam saved. The timer keeps running while you are away.")}
  else if(act==="resume"){run=validRun();if(!run)return;if(Date.now()>=run.deadline){finishExam(true);return}run.confirm=false;render();tick()}
  else if(act==="discard"){lsSet(LS_RUN,null);render()}
  else if(act==="reset"){confirmReset=true;render()}
  else if(act==="cancel-reset"){confirmReset=false;render()}
  else if(act==="do-reset"){confirmReset=false;await clearAll();render();flash("Progress deleted.")}
});
document.addEventListener("keydown",e=>{
  if(!run||e.target.closest("select"))return;const q=QBY[run.ids[run.i]];if(!q)return;const pos=L.indexOf(e.key.toUpperCase());
  if(pos>=0&&pos<q.o.length&&!(run.kind==="practice"&&run.checked[q.id])){toggle(q,ORDER[q.id][pos]);if(run.kind==="exam")lsSet(LS_RUN,run);render()}
});
document.querySelector("nav.tabs").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;if(run&&run.kind==="exam"){lsSet(LS_RUN,run);clearInterval(timerId);run=null;flash("Exam saved. Resume it from Full exams.")}result=null;if(run)run=null;if(location.hash==="#"+a.dataset.v){e.preventDefault();view=a.dataset.v;render()}});

const h=location.hash.slice(1);if(["dashboard","practice","exams"].includes(h))view=h;
initStore();
</script>

</body>
