<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Foundations Exam Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a study desk. Sticky top bar with three tabs; one centered 960px column; question runner as a focused sheet. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --fg:#14232B; --muted:#5A6B70; --line:#CDD7D5;
  --accent:#0B6E64; --accent-ink:#FFFFFF; --accent-soft:#D5ECE8;
  --good:#2C7A47; --good-soft:#DCEFE2; --bad:#B03C2B; --bad-soft:#F6DFDA; --warn:#9A6512; --warn-soft:#F4E7CF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1518; --surface:#162126; --sunk:#1D2A30; --fg:#E4ECEA; --muted:#93A5A8; --line:#2A3A40;
  --accent:#4BC0AE; --accent-ink:#06201C; --accent-soft:#183A36;
  --good:#5CC27F; --good-soft:#18352A; --bad:#EE7C69; --bad-soft:#3D221E; --warn:#E0A84B; --warn-soft:#3A2D16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1518; --surface:#162126; --sunk:#1D2A30; --fg:#E4ECEA; --muted:#93A5A8; --line:#2A3A40;
  --accent:#4BC0AE; --accent-ink:#06201C; --accent-soft:#183A36;
  --good:#5CC27F; --good-soft:#18352A; --bad:#EE7C69; --bad-soft:#3D221E; --warn:#E0A84B; --warn-soft:#3A2D16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:500}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav.tabs a{color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:700;line-height:1.15}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .v{font-family:var(--f-mono);font-size:28px;line-height:1.1;margin-top:6px}
.kpi .s{color:var(--muted);font-size:13px;margin-top:4px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;font-weight:500}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.domains{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) 140px 64px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.dcode{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500}
.dname{font-weight:700;min-width:0}
.dmeta{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.target::after{content:"";position:absolute;left:72%;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.35}
.dpct{text-align:right;font-family:var(--f-mono);font-size:14px}
.chart svg{width:100%;height:auto;display:block}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.hist td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;color:var(--muted);text-align:left}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}

/* runner */
.runner{max-width:760px;margin:0 auto}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rhead .grow{margin-right:auto}
.progress{height:4px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--f-mono);font-size:15px;padding:4px 10px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--warn-soft);color:var(--warn)}
.qtext{white-space:pre-line;font-size:19px;line-height:1.45;margin:0 0 6px;font-weight:700;max-width:65ch}
.qhint{font-size:13px;color:var(--warn);font-weight:700;margin-bottom:12px}
.choices{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-weight:400;font-size:16px;line-height:1.4}
.choice .k{font-family:var(--f-mono);font-size:13px;flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .k{background:var(--good);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad);color:var(--surface)}
.choice:disabled{opacity:1;cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--sunk);padding:12px 14px;border-radius:0 8px 8px 0;margin:6px 0 14px}
.explain b{display:block;margin-bottom:2px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px}
.navgrid button{padding:6px 0;font-family:var(--f-mono);font-size:13px;font-weight:500;border-radius:6px}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.navgrid button.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.confirm{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:14px;margin-top:14px}
.score-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.score-big{font-family:var(--f-mono);font-size:56px;line-height:1}
.score-big small{font-size:20px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface)}
.ritem .qtext{font-size:16px}
.ritem ul{margin:8px 0;padding-left:18px}
.ritem li.c{color:var(--good);font-weight:700}
.ritem li.x{color:var(--bad);text-decoration:line-through}
.note{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px}
.banner span{margin-right:auto}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drow{grid-template-columns:36px minmax(0,1fr) 56px}
  .drow .bar{grid-column:2 / 4}
  h1{font-size:25px}
  .score-big{font-size:44px}
}
@media (prefers-reduced-motion:no-preference){.bar i,.progress i{transition:width .35s ease}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Foundations Prep <small>CCAO-F</small></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
    <a href="#practice" data-v="practice">Practice</a>
    <a href="#exams" data-v="exams">Full exams</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const QUESTIONS = [
// Set 1 (uploaded Set-1.docx; same content as Amey Thakur mock exam 1, MIT licence)
{"d": 2, "q": "A colleague shares a Claude-drafted policy summary that reads well and cites three internal documents by name. What is the appropriate review step before it circulates to the whole department?", "o": ["Circulate it, since the named sources demonstrate grounding", "Ask Claude to double-check its own work and circulate if it agrees", "Confirm each named document exists and says what the summary claims", "Add a disclaimer that the summary was AI-generated and circulate"], "a": [2], "e": "Named sources can be fabricated; verification against the actual documents is the diligence step. Self-checking (B) is not independent evidence, and a disclaimer (D) does not make content correct", "s": "amey", "ref": "Set 1, Q1", "set": "1", "fixed": 1},
{"d": 1, "q": "You need a first draft of a stakeholder update from a long project log. Which prompt is most likely to produce a usable draft on the first attempt?", "o": ["\"Summarize this project log.\"", "\"Write something good about this project log for my boss.\"", "\"Summarize this project log. Be detailed and thorough and professional.\"", "\"You are writing a weekly update for non-technical executives. From the log, produce: status in one line, three progress items, two risks with owners, and next week's focus. Keep it under 200 words.\""], "a": [3], "e": "Role, audience, explicit structure, and length constraints are what turn a vague request into a usable draft. Intensifiers like \"detailed and thorough\" (C) add no structure", "s": "amey", "ref": "Set 1, Q2", "set": "1", "fixed": 1},
{"d": 3, "q": "A workflow drafts hundreds of routine appointment confirmations each day. Latency and cost dominate; the language is formulaic. Which choice fits?", "o": ["A fast, low-cost model, reserving a more capable one for exceptions", "The most capable model, for consistency", "Whichever model is newest", "Alternate between models to spread cost"], "a": [0], "e": "Match the model tier to the work: fast and cheap for formulaic volume, capable for exceptions", "s": "amey", "ref": "Set 1, Q3", "set": "1", "fixed": 1},
{"d": 5, "q": "Your team's Project answers questions from a product manual. Users report confident answers about a feature that was removed last quarter. What is the most likely cause?", "o": ["The model needs retraining", "The Project's knowledge still contains the outdated manual", "Users are asking the questions wrong", "The context window is too small"], "a": [1], "e": "Project knowledge is maintained by you; stale documents produce confidently outdated answers", "s": "amey", "ref": "Set 1, Q4", "set": "1", "fixed": 1},
{"d": 6, "q": "Legal asks you to analyze a spreadsheet of support tickets containing customer names and email addresses. Your organization prohibits sending personal data to external tools. What do you do?", "o": ["Upload it, since legal requested the analysis", "Upload it and ask Claude to disregard the personal columns", "Strip or pseudonymize the personal columns, then analyze what remains", "Tell legal the analysis is not possible"], "a": [2], "e": "Make the task compliant, then do it. A requester's seniority does not override policy, and instructing the model to ignore data does not un-send it", "s": "amey", "ref": "Set 1, Q5", "set": "1", "fixed": 1},
{"d": 1, "q": "Claude produces a five-paragraph answer when you needed three bullet points, twice in a row. What is the most effective adjustment?", "o": ["Ask again and hope for variation", "Switch to a more capable model", "Manually reformat each response", "State the format explicitly, including the number of bullets and their maximum length"], "a": [3], "e": "Format failures are fixed by stating the format, not by re-rolling or upgrading the model", "s": "amey", "ref": "Set 1, Q6", "set": "1", "fixed": 1},
{"d": 2, "q": "Which of these is the strongest signal that a Claude-generated claim needs verification before use?", "o": ["The claim is a specific number, date, or citation that would matter if wrong", "The answer is long", "The answer was produced quickly", "The answer uses technical vocabulary"], "a": [0], "e": "Specific, consequential details are the highest-risk surface for fabrication. Length, speed, and vocabulary carry no accuracy signal", "s": "amey", "ref": "Set 1, Q7", "set": "1", "fixed": 1},
{"d": 4, "q": "A manager wants to know whether Claude can \"replace our weekly reporting process.\" What is the most useful response?", "o": ["Yes, automation is what AI is for", "A breakdown of which reporting steps Claude can draft or summarize, which need human judgment or system access, and what the review step would be", "No, reporting requires human oversight", "A recommendation to hire a consultant"], "a": [1], "e": "The valued skill is a realistic division of labor with a review step, not a yes or a no", "s": "amey", "ref": "Set 1, Q8", "set": "1", "fixed": 1},
{"d": 5, "q": "You are configuring a Project that several colleagues will use for consistent client communications. What belongs in the Project instructions rather than in each individual prompt?", "o": ["The specific client's name for today's message", "Today's date", "The house tone, required disclaimers, and the standard structure of a client message", "The colleague's personal writing preferences"], "a": [2], "e": "Durable, shared conventions belong in instructions; per-message specifics belong in the prompt", "s": "amey", "ref": "Set 1, Q9", "set": "1", "fixed": 1},
{"d": 2, "q": "A summary Claude produced omits a material caveat that appears in the source document. What does this failure mode illustrate?", "o": ["Hallucination through fabricated detail", "A context window limit", "A prompt injection attack", "Omission, which requires reading the source rather than only reviewing the output"], "a": [3], "e": "Omission is as damaging as fabrication and is only visible if you read the source, not just the output", "s": "amey", "ref": "Set 1, Q10", "set": "1", "fixed": 1},
{"d": 7, "q": "Your prompt worked well last month and now returns weaker results after your team added twelve documents to the Project's knowledge. What is the first thing to investigate?", "o": ["Whether the new documents are diluting or contradicting the sources the answers should use", "Whether the model changed", "Whether colleagues are using different browsers", "Whether the prompt should be longer"], "a": [0], "e": "Diagnose the change that coincided with the regression before rewriting anything", "s": "amey", "ref": "Set 1, Q11", "set": "1", "fixed": 1},
{"d": 4, "q": "For which task is a Project with persistent instructions and knowledge clearly better than a one-off chat?", "o": ["Asking for a synonym", "A monthly report that follows the same structure and draws on the same reference documents", "Checking a single fact", "Rewriting one email"], "a": [1], "e": "Repeated work with stable context and structure is exactly what Projects are for", "s": "amey", "ref": "Set 1, Q12", "set": "1", "fixed": 1},
{"d": 2, "q": "Which practice best reduces the risk of sharing an inaccurate Claude output with a customer?", "o": ["Reading the output for tone before sending", "Sending it with a note that AI assisted", "Verifying the claims that would cause harm if wrong, then having a second person review customer-facing material", "Using the largest available model"], "a": [2], "e": "Verification of consequential claims plus human review for customer-facing material. Model size is not a control", "s": "amey", "ref": "Set 1, Q13", "set": "1", "fixed": 1},
{"d": 4, "q": "You want Claude to help redesign a slow approval process rather than just speed up its current steps. Which prompt direction fits that goal?", "o": ["\"Make our approval process faster.\"", "\"Automate our approvals.\"", "\"What do other companies do for approvals?\"", "\"Here are the current approval steps and where delays occur. Propose two redesigns: one that keeps the current structure and one that reorders or removes steps, with the tradeoffs of each.\""], "a": [3], "e": "Process redesign requires giving Claude the current steps, the pain points, and asking for alternatives with tradeoffs", "s": "amey", "ref": "Set 1, Q14", "set": "1", "fixed": 1},
{"d": 6, "q": "Which situation most clearly calls for escalating to a technical colleague rather than solving it yourself?", "o": ["A request to connect Claude directly to the company's internal order database through an integration", "A prompt that needs better structure", "An output with the wrong tone", "A Project that needs its knowledge updated"], "a": [0], "e": "System integrations belong to the Developer and Architect scope; recognizing that boundary is an Associate competency", "s": "amey", "ref": "Set 1, Q15", "set": "1", "fixed": 1},
// Set 2 (uploaded Set-2.docx; Amey Thakur, MIT licence)
{"d": 2, "q": "Claude returns a policy answer that matches your expectation exactly, with no citation. What does the match tell you?", "o": ["The answer is confirmed, since it agrees with your understanding", "The answer is probably correct but should be reworded", "Nothing about accuracy, because agreement with an expectation is not evidence", "The model has read the policy document"], "a": [2], "e": "Agreement with what you already believed is the easiest error to miss, since nothing prompts a check. Neither confirmation (A), rewording (B), nor an assumption about retrieval (D) establishes that the claim is true", "s": "amey", "ref": "Set 2, Q1", "set": "2", "fixed": 1},
{"d": 2, "q": "A colleague asks Claude to check its own earlier answer, and it confirms the answer. How much weight does the confirmation carry?", "o": ["None on its own, because the check is not independent of the thing being checked", "Substantial, because the model reviewed its own reasoning", "Substantial if the confirmation is detailed", "It depends on the model used"], "a": [0], "e": "Self-review is not an independent source and cannot establish correctness. Detail (C) and model choice (D) do not make a self-check independent", "s": "amey", "ref": "Set 2, Q2", "set": "2", "fixed": 1},
{"d": 2, "q": "A report drafted with Claude contains one figure you cannot verify from any available source. What is the appropriate handling before circulation?", "o": ["Circulate it with a general disclaimer about AI assistance", "Keep the figure and mark it as an estimate", "Ask Claude to provide a source and keep whatever it returns", "Remove the figure and note that it could not be verified"], "a": [3], "e": "An unverifiable claim should not be presented as fact, and a labeled gap is honest. A blanket disclaimer (A) does not address the specific figure, an unfounded estimate (B) misrepresents it, and a citation produced on demand (C) needs the same verification", "s": "amey", "ref": "Set 2, Q3", "set": "2", "fixed": 1},
{"d": 4, "q": "Which of these is the strongest candidate to hand to Claude in a monthly close process?", "o": ["Approving the final journal entries", "Drafting the variance commentary from figures that are already agreed", "Deciding which variances require investigation", "Signing off the reconciliation"], "a": [1], "e": "Drafting from agreed inputs is bounded and checkable. Approval (A), sign-off (D), and the decision about what to investigate (C) all carry accountability", "s": "amey", "ref": "Set 2, Q4", "set": "2", "fixed": 1},
{"d": 4, "q": "A workflow produces good output but nobody uses it. What should be examined first?", "o": ["Whether the model should be upgraded", "Whether the output arrives where the work actually happens, in a form people can act on", "Whether the prompt is long enough", "Whether more people need training"], "a": [1], "e": "Adoption usually fails on fit with the existing process rather than on output quality. Model (A) and prompt length (C) address quality that is already acceptable, and training (D) treats a symptom", "s": "amey", "ref": "Set 2, Q5", "set": "2", "fixed": 1},
{"d": 6, "q": "A team wants to paste anonymised customer feedback into Claude for theme analysis. What remains a risk after names are removed?", "o": ["Nothing, since anonymisation removes the risk entirely", "The model may store the text permanently", "Theme analysis is unreliable on anonymised data", "Free text can still identify people through specific details, so review before sending is still needed"], "a": [3], "e": "Removing names does not remove identifying detail from free text, which is why a review step remains. Treating anonymisation as complete (A) is the error tested, and neither storage assumptions (B) nor reliability (C) is the governance issue here", "s": "amey", "ref": "Set 2, Q6", "set": "2", "fixed": 1},
{"d": 6, "q": "Who should decide whether a Claude-assisted output is fit to send to a customer?", "o": ["The person accountable for the customer relationship", "Whoever wrote the prompt", "The model, if asked to assess its own output", "Nobody, if the workflow was approved in advance"], "a": [0], "e": "Accountability for the outgoing communication decides the question. Prompt authorship (B) is incidental, self-assessment (C) is not independent, and prior approval of a workflow (D) does not review this instance", "s": "amey", "ref": "Set 2, Q7", "set": "2", "fixed": 1},
{"d": 1, "q": "A prompt works well until the input document is much longer than usual, when quality drops. What is the most likely explanation?", "o": ["The model became less capable", "The prompt is too short", "The relevant material is now competing with far more surrounding text", "Longer documents always produce worse output"], "a": [2], "e": "Dilution across a much longer input is the usual cause of this pattern. The model has not changed (A), prompt length (B) is not the variable that changed, and length alone is not determinative (D)", "s": "amey", "ref": "Set 2, Q8", "set": "2", "fixed": 1},
{"d": 1, "q": "You want the same analysis applied to fifty documents with consistent output. What matters most?", "o": ["Using the largest model available", "Processing the documents in one conversation", "Reviewing only a sample of the outputs", "Fixing the prompt and the required output structure, and applying both unchanged to every document"], "a": [3], "e": "Consistency across a set comes from holding the instruction and the output shape constant. Model size (A) does not create consistency, one long conversation (B) invites drift, and sampling (C) is a review policy rather than a design", "s": "amey", "ref": "Set 2, Q9", "set": "2", "fixed": 1},
{"d": 3, "q": "A task must return an answer within a second for an interactive interface, and the work is simple classification. What follows?", "o": ["Use the most capable model to be safe", "Batch the requests", "Use the smallest model that meets the accuracy requirement, since latency is the binding constraint", "Increase the context supplied"], "a": [2], "e": "With a hard latency requirement and a simple task, the smallest sufficient model is the fit. The most capable model (A) spends latency for accuracy that is not needed, batching (B) breaks interactivity, and more context (D) adds cost and time", "s": "amey", "ref": "Set 2, Q10", "set": "2", "fixed": 1},
{"d": 3, "q": "What is the correct reading of a model's published benchmark score when choosing for a specific business task?", "o": ["It predicts performance on your task", "It is a general signal that does not substitute for evaluating on your own task", "It is irrelevant", "It determines the price you should expect to pay"], "a": [1], "e": "Benchmarks indicate general capability and cannot stand in for measurement on the actual task. Treating them as predictive (A) or irrelevant (C) are both wrong, and they do not set price (D)", "s": "amey", "ref": "Set 2, Q11", "set": "2", "fixed": 1},
{"d": 5, "q": "Two teams keep separate copies of the same reference documents in their own projects. What is the main risk?", "o": ["The copies drift apart, and the two teams begin answering the same question differently", "Higher storage cost", "Slower responses", "The model becomes confused between projects"], "a": [0], "e": "Duplicated knowledge diverges as each copy is maintained separately, producing inconsistent answers. Storage (B) and speed (C) are minor, and projects do not leak into one another (D)", "s": "amey", "ref": "Set 2, Q12", "set": "2", "fixed": 1},
{"d": 5, "q": "What is the right first step when setting up a project for a recurring task?", "o": ["Decide what the task needs to know every time, and add only that", "Upload every document the team owns", "Write the longest possible instruction", "Add documents as questions come up, without review"], "a": [0], "e": "A deliberate, minimal base keeps retrieval sharp and is maintainable. Uploading everything (B) and accumulating without review (D) both dilute, and instruction length (C) is not the question", "s": "amey", "ref": "Set 2, Q13", "set": "2", "fixed": 1},
{"d": 7, "q": "A user reports that Claude gave a wrong answer, but you cannot reproduce it. What is the most useful next step?", "o": ["Assume the user made an error", "Obtain the exact prompt, inputs, and configuration they used", "Increase the model size for everyone", "Add a warning to the interface"], "a": [1], "e": "Reproduction depends on the exact conditions, and gathering them is the only way to diagnose. Dismissing the report (A) discards the signal, and a model change (C) or a warning (D) acts before the cause is known", "s": "amey", "ref": "Set 2, Q14", "set": "2", "fixed": 1},
{"d": 7, "q": "Output quality varies between runs of an identical prompt on identical input. What does this indicate?", "o": ["The system is broken", "The temperature must be zero for all tasks", "Some variation is expected, and the task needs constraints tight enough that the variation does not matter", "The input must be shortened"], "a": [2], "e": "Generation is not deterministic, so the design must tolerate variation within acceptable bounds. Treating it as breakage (A) misreads normal behavior, a universal temperature rule (B) is too blunt, and input length (D) is unrelated", "s": "amey", "ref": "Set 2, Q15", "set": "2", "fixed": 1},
// Set 3 (uploaded Set-3.docx; Amey Thakur, MIT licence)
{"d": 2, "q": "A summary cites a statistic that turns out to be correct. Does that validate the rest of the summary?", "o": ["Yes, one verified claim indicates the whole is reliable", "Yes, if the statistic was the hardest claim", "No, each material claim needs its own check", "Only if the source was named"], "a": [2], "e": "Verification does not generalise from one claim to the others. Treating it as a proxy for the whole (A, B) is the error tested, and naming a source (D) does not verify the remaining claims", "s": "amey", "ref": "Set 3, Q1", "set": "3", "fixed": 1},
{"d": 2, "q": "Claude declines to answer part of a request and explains why. How should this be read?", "o": ["As information about a limit or a policy that is worth understanding before proceeding", "As a failure that should be worked around", "As a sign the prompt was too long", "As a reason to switch models"], "a": [0], "e": "A refusal with a reason is a signal about the task, not an obstacle to route around. Working around it (B) ignores the reason, and neither prompt length (C) nor model choice (D) is indicated", "s": "amey", "ref": "Set 3, Q2", "set": "3", "fixed": 1},
{"d": 2, "q": "You need to know whether a long report supports a specific conclusion. What is the most reliable approach?", "o": ["Ask for a summary and read that", "Ask whether the report supports the conclusion", "Ask for a confidence score", "Ask for the passages that bear on the conclusion, then read those passages yourself"], "a": [3], "e": "Retrieving the evidence and reading it keeps the judgment with you. A summary (A) and a direct verdict (B) hand the judgment to the model, and a confidence score (C) is not evidence", "s": "amey", "ref": "Set 3, Q3", "set": "3", "fixed": 1},
{"d": 4, "q": "A manual process takes four hours and produces a document nobody reads. What should happen before automating it?", "o": ["Automate it, since four hours is significant", "Establish whether the document is needed at all", "Automate it and measure adoption afterwards", "Split it across more people"], "a": [1], "e": "Automating unnecessary work makes waste faster. Proceeding regardless (A, C) skips the question, and redistributing it (D) does not address whether it is needed", "s": "amey", "ref": "Set 3, Q4", "set": "3", "fixed": 1},
{"d": 4, "q": "Which sequencing is correct when introducing Claude to a recurring team process?", "o": ["Automate the whole process, then refine", "Start with the step that is bounded and checkable, prove it, then extend", "Start with the hardest step, since it has most value", "Let each person adopt it however they prefer"], "a": [1], "e": "A bounded first step produces evidence and trust cheaply. Full automation first (A) risks everything at once, the hardest step (C) is the least likely to succeed early, and uncoordinated adoption (D) produces drift", "s": "amey", "ref": "Set 3, Q5", "set": "3", "fixed": 1},
{"d": 6, "q": "A policy forbids sending customer data to external services. A colleague asks Claude to summarise a customer email. What applies?", "o": ["Nothing, because summarising is not sending", "The policy only if the customer is named", "Nothing, because the output stays internal", "The policy, since the email is customer data"], "a": [3], "e": "Submitting the content is the act the policy governs. Framing it as summarising (A) or by where the output goes (C) misreads the policy, and it is not limited to named individuals (B)", "s": "amey", "ref": "Set 3, Q6", "set": "3", "fixed": 1},
{"d": 6, "q": "What is the correct response to a request that a model output be presented as human-written to a customer?", "o": ["Decline to misrepresent it, and raise the disclosure question with whoever owns the relationship", "Comply, since the customer cares about quality not provenance", "Comply if the output was heavily edited", "Comply and record the decision internally"], "a": [0], "e": "Actively misrepresenting provenance is the issue, and it belongs to the person accountable for the relationship. Editing (C) and internal records (D) do not make the representation true, and quality (B) is not the point", "s": "amey", "ref": "Set 3, Q7", "set": "3", "fixed": 1},
{"d": 1, "q": "A prompt asks for a recommendation and gets a balanced discussion instead. What is the most likely cause?", "o": ["The model is incapable of recommending", "The temperature is too high", "The prompt did not state that a single recommendation with a reason was required", "The input was too short"], "a": [2], "e": "Output shape follows the instruction, and no decision was requested. Incapability (A) is not the issue, and neither temperature (B) nor input length (D) determines whether a recommendation is given", "s": "amey", "ref": "Set 3, Q8", "set": "3", "fixed": 1},
{"d": 1, "q": "What is the most effective way to get output pitched at the right level for a specific audience?", "o": ["Ask for it to be clear", "Ask for a shorter response", "Ask for simpler words", "Name the audience and what they already know"], "a": [3], "e": "Naming the reader and their prior knowledge is what calibrates level. Clarity (A), length (B), and vocabulary (C) are consequences rather than the instruction", "s": "amey", "ref": "Set 3, Q9", "set": "3", "fixed": 1},
{"d": 3, "q": "A colleague uses the largest model for every task including formatting. What should you point out?", "o": ["Nothing, capability is never wasted", "That the largest model is less accurate on simple tasks", "That matching the model to the work saves cost without losing anything on simple tasks", "That formatting should be done manually"], "a": [2], "e": "Fit-to-task is the principle, and simple work does not benefit from extra capability. Capability is not free (A), larger models are not less accurate on simple tasks (B), and manual work (D) is not the alternative", "s": "amey", "ref": "Set 3, Q10", "set": "3", "fixed": 1},
{"d": 3, "q": "When does the choice of interface matter more than the choice of model?", "o": ["Never, the model determines the outcome", "When the obstacle is how people supply context and act on output, not the quality of the answer", "Only for very large teams", "Only when cost is constrained"], "a": [1], "e": "Where adoption or context-supply is the bottleneck, interface dominates. Treating the model as decisive (A) misses that, and neither team size (C) nor cost (D) defines the case", "s": "amey", "ref": "Set 3, Q11", "set": "3", "fixed": 1},
{"d": 5, "q": "What is the risk of adding a document to project knowledge without removing the version it replaces?", "o": ["Both versions can be drawn on, producing answers that mix current and superseded material", "Storage cost", "Slower responses", "The project will refuse to answer"], "a": [0], "e": "Superseded material remains retrievable and contradicts the current version. Storage (B) and speed (C) are minor, and the project does not refuse (D)", "s": "amey", "ref": "Set 3, Q12", "set": "3", "fixed": 1},
{"d": 5, "q": "Which is the better test of whether something belongs in project knowledge?", "o": ["Whether every conversation in the project would benefit from it", "Whether it is long enough to be worth uploading", "Whether it was recently created", "Whether it is confidential"], "a": [0], "e": "Recurrence across conversations is what distinguishes shared knowledge from prompt content. Length (B), recency (C), and sensitivity (D) are unrelated to that test", "s": "amey", "ref": "Set 3, Q13", "set": "3", "fixed": 1},
{"d": 7, "q": "A previously reliable prompt now returns shorter answers than before. What is worth checking first?", "o": ["Whether the model is deprecated", "Whether the input or the instructions changed, including anything added to the project", "Whether the network is slow", "Whether the account has hit a limit"], "a": [1], "e": "A behavioral change points to a change in inputs or configuration. Deprecation (A), network (C), and limits (D) produce errors rather than shorter answers", "s": "amey", "ref": "Set 3, Q14", "set": "3", "fixed": 1},
{"d": 7, "q": "Someone reports that Claude is wrong about a fact that it stated correctly last week. What is the most useful first question?", "o": ["Which model did you use", "How long was the conversation", "What exactly did you ask, and what did it reply", "Have you tried again"], "a": [2], "e": "The exact exchange is what makes the claim examinable. Model (A), length (B), and retrying (D) may matter later but none of them establishes what happened", "s": "amey", "ref": "Set 3, Q15", "set": "3", "fixed": 1},
// Set 4 (uploaded Set-4.docx; Amey Thakur, MIT licence)
{"d": 2, "q": "Claude summarizes a vendor contract for you and states that the termination clause requires 60 days' notice, citing section 14.2. You are about to send the summary to your legal team. What should you do first?", "o": ["Check section 14.2 of the contract and confirm the notice period before sending", "Send it, since Claude cited a specific section", "Ask Claude how confident it is and send if the confidence is high", "Rephrase the summary in more formal language, then send"], "a": [0], "e": "Specific-looking citations can be fabricated, and material bound for legal review requires verification against the source document. A specific citation is not evidence of accuracy (B), self-reported confidence is not a reliability signal (C), and rewording does nothing about correctness (D).", "s": "amey", "ref": "Set 4, Q1", "set": "4", "fixed": 1},
{"d": 2, "q": "You ask Claude to draft a competitive analysis, and the output presents market share figures for three competitors without sources. The figures look plausible. What is the appropriate handling?", "o": ["Include the figures, since plausibility is sufficient for internal documents", "Verify each figure against a market research source and keep only what checks out, with citations", "Delete the figures and note that no market data was available", "Ask Claude to regenerate until the numbers stabilize across runs"], "a": [1], "e": "Unsourced quantitative claims are a classic hallucination surface; the professional move is verification against an authoritative source, keeping what survives. Plausibility is not accuracy (A), deleting everything discards genuinely verifiable material (C), and consistency across regenerations does not establish truth (D).", "s": "amey", "ref": "Set 4, Q2", "set": "4", "fixed": 1},
{"d": 1, "q": "You need Claude to produce a quarterly report from meeting notes, a spreadsheet summary, and last quarter's report. The first attempt misses the required structure and tone. What is the most effective next step?", "o": ["Retry the identical prompt, since outputs vary between runs", "Switch to the most capable model and resend the same prompt", "Rewrite the prompt to state the role, the required sections in order, the tone, and attach last quarter's report as a format example", "Break the work into forty single-sentence prompts"], "a": [2], "e": "Structure, explicit constraints, and an example of the target format are the most effective fixes for a formatting and tone miss. Re-rolling (A) leaves the deficiency in place, a larger model does not learn unstated requirements (B), and over-fragmentation destroys coherence (D).", "s": "amey", "ref": "Set 4, Q3", "set": "4", "fixed": 1},
{"d": 1, "q": "A colleague's prompt asks Claude to \"analyze our customer feedback and fix the problems.\" The output is generic. Which revision best applies task decomposition?", "o": ["Add \"be specific and detailed\" to the prompt", "Ask the same question three times and merge the answers", "Paste more feedback into the same prompt", "Ask first for a categorized list of complaint themes with counts, then for the top three by frequency, then for a proposed action per theme"], "a": [3], "e": "Decomposition turns a vague compound request into a sequence of verifiable steps, each with a concrete output. Vague intensifiers (A) do not add structure, repetition (B) multiplies the vagueness, and more input without more structure (C) usually worsens focus.", "s": "amey", "ref": "Set 4, Q4", "set": "4", "fixed": 1},
{"d": 3, "q": "Your team drafts hundreds of short, routine customer replies daily, and cost and speed matter more than nuance. Occasionally a complex escalation needs careful reasoning. What is the sound model strategy?", "o": ["Use the most capable model for everything to maximize quality", "Use the fastest, lowest-cost model for routine replies and switch to a more capable model for the complex escalations", "Use the fastest model for everything, including escalations", "Alternate models randomly to balance the load"], "a": [1], "e": "B matches model choice to the task in both directions: the fast, low-cost model for routine replies and a more capable model for complex escalations. A wastes cost and speed on routine work, C underserves the cases that need depth, and D matches nothing to anything.", "s": "amey", "ref": "Set 4, Q5", "set": "4", "fixed": 1},
{"d": 4, "q": "Your monthly close process involves collecting figures, drafting a variance commentary, and formatting a board pack. You want Claude to help durably, not just once. What is the strongest approach?", "o": ["Create a Project with the commentary conventions and prior packs as knowledge, plus instructions for the structure, and run each close inside it", "Paste everything into a fresh chat each month and ask for the pack", "Ask Claude to do the whole close autonomously, including pulling the figures", "Use Claude only for spellchecking the final pack"], "a": [0], "e": "Durable, repeated workflows belong in a Project where instructions and knowledge persist and improve. Re-pasting monthly (B) rebuilds context by hand every time, full autonomy over financial figures without review (C) ignores appropriate-use judgment, and spellchecking (D) forfeits the actual value.", "s": "amey", "ref": "Set 4, Q6", "set": "4", "fixed": 1},
{"d": 4, "q": "A department head asks you whether Claude could \"handle our customer onboarding.\" What is the right first move?", "o": ["Say yes and start building immediately", "Map the onboarding steps, identify which involve drafting, summarizing, or lookup that Claude does well, and which need human judgment or system access it does not have", "Say no, since onboarding involves customer data", "Forward the question to Anthropic support"], "a": [1], "e": "The Associate's core skill is translating a business ask into a realistic division of labor: where Claude adds value, where humans stay, and what the limits are. Unqualified yes (A) and unqualified no (C) both skip the analysis, and support (D) does not know your process.", "s": "amey", "ref": "Set 4, Q7", "set": "4", "fixed": 1},
{"d": 5, "q": "Your team's Project answers policy questions from an uploaded handbook. HR publishes a new handbook version. What must happen for the Project to stay trustworthy?", "o": ["Nothing; Claude will find the new version on its own", "Add the new handbook alongside the old one so both are available", "Replace the outdated handbook in the Project knowledge and spot-check answers against the new version", "Tell users to mention the new version in every prompt"], "a": [2], "e": "Project knowledge is maintained, not self-updating; stale sources are a quality defect the configurer owns. Claude does not fetch your internal documents on its own (A), keeping both versions invites contradictory answers (B), and pushing the burden onto every user (D) is not maintenance.", "s": "amey", "ref": "Set 4, Q8", "set": "4", "fixed": 1},
{"d": 6, "q": "You want Claude to analyze churn patterns in an export that includes customer names, emails, and account numbers. Company policy forbids sharing personal data with external tools. What is the correct action?", "o": ["Upload the file, since churn analysis is an internal purpose", "Upload it but instruct Claude to ignore the personal columns", "Abandon the analysis", "Remove or pseudonymize the identifying columns first, then upload and analyze"], "a": [3], "e": "Make the task compliant, then do it: the identifiers are not needed for pattern analysis. Purpose does not override policy (A), an instruction to ignore data is not a control because the data still left the boundary (B), and abandoning the work (C) is unnecessary when anonymization enables it.", "s": "amey", "ref": "Set 4, Q9", "set": "4", "fixed": 1},
{"d": 7, "q": "A prompt that worked well for weeks now produces off-target answers after your team added many new documents to the Project. What is the best first diagnostic?", "o": ["Check whether the newly added knowledge is diluting or contradicting the sources the answers should draw from", "Rewrite the prompt from scratch", "Switch to a larger model", "Delete the Project and start over"], "a": [0], "e": "The change that coincided with the regression is the first suspect: new knowledge can crowd out or conflict with the relevant sources. Rewriting the prompt (B), upgrading the model (C), or rebuilding everything (D) all treat symptoms before diagnosing the actual change.", "s": "amey", "ref": "Set 4, Q10", "set": "4", "fixed": 1},
{"d": 2, "q": "Claude produces a competitor comparison table where one row is marked “data unavailable” and the rest are filled in. A colleague asks you to delete the empty row so the table looks complete. What is the right response?", "o": ["Delete the row, since an incomplete table undermines confidence", "Keep the row and its label, because the gap is itself a finding the reader needs", "Fill the row with a reasonable estimate and mark it as approximate", "Ask Claude to search harder until every row is populated"], "a": [1], "e": "A declared gap is information: it tells the reader where the analysis is thin. Deleting it (A) hides a limitation, an unmarked estimate (C) manufactures data, and pressing the model to fill the cell (D) invites fabrication rather than retrieval.", "s": "amey", "ref": "Set 4, Q11", "set": "4", "fixed": 1},
{"d": 2, "q": "Two runs of the same prompt give different figures for the same metric. Which conclusion is supported?", "o": ["The higher figure is more likely correct because the model found more evidence", "The figures should be averaged to reduce variance", "Neither figure is established, and the metric must be checked against the source", "The prompt is fine and the model needs a longer context window"], "a": [2], "e": "Disagreement between runs shows the figure is not grounded in a reliable source, so neither is established. Preferring the larger number (A) is arbitrary, averaging (B) treats two unverified numbers as measurements, and context length (D) is unrelated to whether the figure is true.", "s": "amey", "ref": "Set 4, Q12", "set": "4", "fixed": 1},
{"d": 2, "q": "You ask Claude to extract every payment term from a 40-page contract. The output lists four terms, cleanly formatted. What is the first check?", "o": ["Confirm the formatting is consistent across the four entries", "Ask Claude whether it found all of them", "Run it again at a higher temperature to surface more terms", "Read the contract's payment sections to confirm no term was omitted"], "a": [3], "e": "Extraction fails by omission more often than by error, and a tidy output gives no signal about completeness. Formatting (A) is cosmetic, self-report (B) is not evidence, and temperature (C) changes phrasing rather than recall.", "s": "amey", "ref": "Set 4, Q13", "set": "4", "fixed": 1},
{"d": 2, "q": "A summary you commissioned states a conclusion that contradicts your own reading of the source. What should you do?", "o": ["Locate the passage the conclusion rests on and compare it against both readings", "Defer to the summary, since the model read the whole document", "Defer to your reading and treat the summary as wrong", "Ask a colleague which of the two sounds more plausible"], "a": [0], "e": "The disagreement is resolvable by returning to the passage in question, which settles it on evidence. Deferring either way (B, C) decides without checking, and canvassing opinion (D) substitutes plausibility for the source.", "s": "amey", "ref": "Set 4, Q14", "set": "4", "fixed": 1},
{"d": 2, "q": "Claude produces a well-argued recommendation with no citations, on a topic where you have no expertise. What is the appropriate use of it?", "o": ["Adopt it, since the reasoning is internally consistent", "Treat it as a hypothesis to test against sources before acting", "Discard it, because unsourced output has no value", "Ask for citations and adopt whatever comes back"], "a": [1], "e": "Unsourced reasoning is a starting point, useful for structuring an enquiry but not for deciding. Internal consistency is not accuracy (A), the reasoning may still be useful (C), and citations produced on demand need the same verification as the claim (D).", "s": "amey", "ref": "Set 4, Q15", "set": "4", "fixed": 1},
{"d": 4, "q": "A team wants Claude to draft weekly customer health summaries from support tickets, CRM notes, and usage data. Which design detail matters most for the output to stay useful over months?", "o": ["Choosing the largest available model", "Running the summary daily instead of weekly", "Defining what a health summary must contain and keeping that definition in one place the team maintains", "Letting each team member write their own prompt"], "a": [2], "e": "A stable, maintained definition of the deliverable is what keeps output consistent as people and inputs change. Model size (A) does not fix an undefined task, higher frequency (B) multiplies an unclear output, and per-person prompts (D) guarantee drift.", "s": "amey", "ref": "Set 4, Q16", "set": "4", "fixed": 1},
{"d": 4, "q": "Which task in a monthly reporting process is the weakest candidate for delegation to Claude?", "o": ["Drafting the narrative summary from agreed figures", "Reformatting last month's report into the new template", "Extracting the top five variances from a spreadsheet export", "Deciding which underperforming account to escalate to the executive team"], "a": [3], "e": "The escalation decision carries accountability and depends on relationships and context the model does not hold. Drafting (A), reformatting (B), and extraction (C) are all bounded tasks with checkable output.", "s": "amey", "ref": "Set 4, Q17", "set": "4", "fixed": 1},
{"d": 4, "q": "A process works well for one analyst and poorly for three others using the same prompt. What is the most likely cause?", "o": ["The prompt relies on context the first analyst supplies without noticing", "The other three need a more capable model", "The task is unsuitable for Claude", "The other three are using shorter inputs"], "a": [0], "e": "One person succeeding with the same prompt usually means they are contributing unstated context, such as knowing which file to attach or what good looks like. A model change (B) does not supply missing context, the task clearly works (C), and input length (D) is a symptom rather than a cause.", "s": "amey", "ref": "Set 4, Q18", "set": "4", "fixed": 1},
{"d": 4, "q": "When is it appropriate to keep a human approval step in an otherwise automated Claude workflow?", "o": ["Always, since automation is inherently risky", "When the action is hard to reverse or carries external consequences", "Only while the workflow is new, then remove it", "Never, because approval steps defeat the purpose of automation"], "a": [1], "e": "Approval earns its cost where a mistake is expensive or hard to undo. Blanket approval (A) and blanket removal (D) both ignore the specific risk, and a time-based rule (C) removes the check regardless of what the action does.", "s": "amey", "ref": "Set 4, Q19", "set": "4", "fixed": 1},
{"d": 6, "q": "A colleague proposes pasting a customer list into a prompt to draft personalised outreach. What is the correct handling?", "o": ["Proceed, since the prompt is not stored anywhere permanent", "Ask Claude to keep the names confidential", "Remove or replace identifying details before drafting, and reattach them afterwards", "Proceed but delete the conversation afterwards"], "a": [2], "e": "Working on anonymised data and reattaching identifiers afterwards achieves the task without exposing the personal data. Assumptions about storage (A) are not a control, an instruction to the model (B) is not a safeguard, and deleting afterwards (D) does not undo the disclosure.", "s": "amey", "ref": "Set 4, Q20", "set": "4", "fixed": 1},
{"d": 6, "q": "Which statement about instructing a model not to do something is accurate?", "o": ["An instruction in the prompt is an enforceable control", "Instructions are enforceable if placed in a system prompt", "Instructions are enforceable if repeated several times", "An instruction shapes behavior but does not guarantee it, so controls belong outside the prompt"], "a": [3], "e": "Prompt instructions influence behavior and are not guarantees, so anything that must hold is enforced in the surrounding system. Placement (B) and repetition (C) change the strength of the steer, not its nature, and treating it as enforcement (A) is the error the question tests.", "s": "amey", "ref": "Set 4, Q21", "set": "4", "fixed": 1},
{"d": 6, "q": "A regulated report drafted with Claude is about to be filed. What is the reviewer accountable for?", "o": ["The accuracy and compliance of the filed document, regardless of how it was drafted", "Confirming that Claude was used according to policy", "Confirming the prompt included the relevant regulations", "Recording which model version produced the draft"], "a": [0], "e": "Accountability sits with the person who files, and the tool used does not transfer it. Policy compliance (B), prompt content (C), and version records (D) are all reasonable practices that do not replace responsibility for the document.", "s": "amey", "ref": "Set 4, Q22", "set": "4", "fixed": 1},
{"d": 6, "q": "When is disclosing that AI assisted a piece of work most clearly warranted?", "o": ["Whenever any AI tool touched the work at any stage", "When the audience's judgment of the work depends on how it was produced", "Only when the output is published externally", "Only when a written policy requires it"], "a": [1], "e": "Disclosure matters where provenance would change how a reader weighs the work. A universal rule (A) makes the signal meaningless, and confining it to external publication (C) or written policy (D) misses internal cases where it genuinely matters.", "s": "amey", "ref": "Set 4, Q23", "set": "4", "fixed": 1},

// ---- ids, seeded shuffles
(function(){const c={};QUESTIONS.forEach(q=>{c[q.d]=(c[q.d]||0)+1;q.id="d"+q.d+"-"+String(c[q.d]).padStart(2,"0")})})();
const QBY = Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// option order per question is fixed (seeded) so answers never sit in the same slot
const ORDER = Object.fromEntries(QUESTIONS.map(q=>[q.id,q.fixed?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i),rng(hash(q.id)))]));
const SOURCES={amey:{name:"Amey Thakur, CLAUDE-CERTIFICATIONS (MIT licence)",url:"https://amey-thakur.github.io/CLAUDE-CERTIFICATIONS/associate-foundations/practice-questions.html"},upload5:{name:"Your uploaded Set 5 (ExamTopics)",url:"https://www.examtopics.com/exams/anthropic/ccao-f/view/"},prepclubs:{name:"PrepClubs free sample, rewritten in new words",url:"https://prepclubs.com/tests/claude-certified-associate"}};
function srcLine(q){const s=SOURCES[q.s];return `<div class="note" style="margin-top:6px">Source: ${s?`<a href="${s.url}" target="_blank" rel="noopener" style="color:inherit">${esc(s.name)}</a>${q.ref?" · "+esc(q.ref):""}`:"written for this app"}</div>`}

// ---- exam sets: one per uploaded set (q.set), questions kept in the order of the source file
const SETS = [...new Set(QUESTIONS.map(q=>q.set).filter(Boolean))].map(name=>({key:"upload-set-"+name,name:"Set "+name,ids:QUESTIONS.filter(q=>q.set===name).map(q=>q.id)}));
const examMinutes=n=>n*2; // the real exam allows 2 minutes per question

function randomExam(){const r=rng(Date.now());const ids=[];for(const d in DOMAINS){ids.push(...shuffle(QUESTIONS.filter(q=>q.d==d),r).slice(0,DOMAINS[d].n).map(q=>q.id))}return shuffle(ids,r)}

// ---- storage: per-person store when the page runs on claude.ai, browser storage as a backup
const store={db:null,col:null,attempts:[],ready:false,mode:"browser"};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function mergeAttempts(list){const m=new Map(store.attempts.map(a=>[a.id,a]));list.forEach(a=>a&&a.id&&m.set(a.id,a));store.attempts=[...m.values()].sort((a,b)=>a.ts-b.ts)}
async function initStore(){
  mergeAttempts(lsGet(LS_KEY)||[]);
  store.ready=true;render();
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    store.col=db.collection("data/users/"+uid);
    const snap=await Promise.race([store.col.get(),new Promise((_,rej)=>setTimeout(()=>rej("timeout"),10000))]);
    const remote=snap.docs.map(d=>d.data());
    const remoteIds=new Set(remote.map(a=>a.id));
    mergeAttempts(remote);
    store.mode="account";
    // push any attempts that only exist in this browser
    for(const a of store.attempts){if(!remoteIds.has(a.id)){try{await store.col.doc(a.id).set(a)}catch(e){}}}
    lsSet(LS_KEY,store.attempts);render();
  }catch(e){store.col=null}
}
async function saveAttempt(a){
  mergeAttempts([a]);lsSet(LS_KEY,store.attempts);
  if(store.col){try{await store.col.doc(a.id).set(a)}catch(e){}}
}
async function clearAll(){
  const ids=store.attempts.map(a=>a.id);store.attempts=[];lsSet(LS_KEY,[]);
  if(store.col){for(const id of ids){try{await store.col.doc(id).delete()}catch(e){}}}
}

// ---- stats
function latestByQuestion(){const m={};for(const a of store.attempts)for(const [id,ok] of a.answers||[])if(QBY[id])m[id]=ok;return m}
function domainStats(){
  const last=latestByQuestion(),tot={},seen={},right={},ans={},ansR={};
  for(const q of QUESTIONS){tot[q.d]=(tot[q.d]||0)+1;if(q.id in last){seen[q.d]=(seen[q.d]||0)+1;if(last[q.id])right[q.d]=(right[q.d]||0)+1}}
  for(const a of store.attempts)for(const [id,ok] of a.answers||[]){const d=QBY[id]?.d;if(!d)continue;ans[d]=(ans[d]||0)+1;if(ok)ansR[d]=(ansR[d]||0)+1}
  const out={};for(const d in DOMAINS)out[d]={total:tot[d]||0,seen:seen[d]||0,mastered:right[d]||0,answered:ans[d]||0,accuracy:ans[d]?(ansR[d]||0)/ans[d]:null};
  return out;
}
const exams=()=>store.attempts.filter(a=>a.kind==="exam");
const pct=x=>x==null?"–":Math.round(x*100)+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+new Date(ts).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
const fmtDur=s=>{const m=Math.floor(s/60);return m>=60?Math.floor(m/60)+"h "+(m%60)+"m":m+"m "+(s%60)+"s"};
const L="ABCDEFG";

function examChart(ex){
  if(!ex.length)return `<div class="empty">No full exams yet. Your scores will plot here against the 720 pass line. <button class="primary" style="margin-left:8px" data-go="exams">Start an exam</button></div>`;
  const W=720,H=240,p={l:44,r:16,t:14,b:30},iw=W-p.l-p.r,ih=H-p.t-p.b,n=ex.length;
  const x=i=>p.l+(n===1?iw/2:i*iw/(n-1)),y=v=>p.t+ih-(v/1000)*ih;
  const grid=[0,250,500,750,1000].map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`).join("");
  const pts=ex.map((a,i)=>[x(i),y(a.score)]);
  const line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=n>1?`<path d="${line} L${pts[n-1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z" fill="var(--accent)" opacity=".1"/>`:"";
  const dots=ex.map((a,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i===n-1?6:4}" fill="${a.score>=PASS?"var(--good)":"var(--bad)"}" stroke="var(--surface)" stroke-width="2"><title>${esc(a.title)}: ${a.score}</title></circle>`).join("");
  const labels=ex.map((a,i)=>(n<=12||i%Math.ceil(n/12)===0||i===n-1)?`<text x="${pts[i][0]}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">#${i+1}</text>`:"").join("");
  const lastLbl=`<text x="${Math.min(pts[n-1][0]+10,W-p.r-30)}" y="${pts[n-1][1]-10}" font-size="12" fill="var(--fg)" font-family="var(--f-mono)">${ex[n-1].score}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Exam scores">${grid}
  <line x1="${p.l}" x2="${W-p.r}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="var(--warn)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-p.r}" y="${y(PASS)-6}" text-anchor="end" font-size="11" fill="var(--warn)" font-family="var(--f-mono)">PASS 720</text>
  ${area}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}${labels}${lastLbl}</svg>`;
}
function historyTable(){
